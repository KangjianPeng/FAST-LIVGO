/laserMapping:
  ros__parameters:
    common:
      img_topic: "/camera/left/image_raw"
      lid_topic: "/lidar/points"
      imu_topic: "/imu/data"
      img_en: 1
      lidar_en: 1
      ros_driver_bug_fix: false

    extrin_calib:
      # GREAT 2020-10-27 calibration, LiDAR frame to MEMS IMU frame.
      extrinsic_T: [-0.007850365227, -0.075816654761, 0.468300496763]
      extrinsic_R: [0.013444803184, -0.999901678027, -0.003983910859,
                    0.999780822115, 0.013506910929, -0.015995970991,
                    0.016048208564, -0.003767974992, 0.999864119451]
      # LiDAR frame to left camera frame.
      Rcl: [0.018253614576, -0.999833379903, 0.000134112454,
            0.001091739139, -0.000114203216, -0.999999397531,
            0.999832792851, 0.018253749994, 0.001089472612]
      Pcl: [0.145853435594, -0.418790966923, -0.265389706791]

    time_offset:
      # The converter stamps LiDAR at scan start and stores point offsets in us.
      lidar_time_offset: 0.0
      imu_time_offset: 0.0
      img_time_offset: 0.0
      exposure_time_init: 0.0

    preprocess:
      point_filter_num: 1
      filter_size_surf: 0.2
      lidar_type: 2  # 16-line Velodyne-compatible PointCloud2
      scan_line: 16
      blind: 1.0

    vio:
      max_iterations: 5
      outlier_threshold: 1000.0
      img_point_cov: 1000.0
      patch_size: 8
      patch_pyrimid_level: 3
      normal_en: true
      raycast_en: false
      inverse_composition_en: false
      exposure_estimate_en: true
      inv_expo_cov: 0.1

    imu:
      imu_en: true
      imu_int_frame: 30
      acc_cov: 0.05
      gyr_cov: 0.03
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      ba_bg_est_en: true

    lio:
      max_iterations: 5
      dept_err: 0.02
      beam_err: 0.05
      min_eigen_value: 0.0025
      voxel_size: 0.5
      max_layer: 2
      max_points_num: 50
      layer_init_num: [5, 5, 5, 5, 5]

    local_map:
      map_sliding_en: true
      half_map_size: 100
      sliding_thresh: 8.0

    uav:
      imu_rate_odom: false
      gravity_align_en: false

    publish:
      dense_map_en: false
      pub_effect_point_en: false
      pub_plane_en: false
      pub_scan_num: 1
      blind_rgb_points: 0.0

    evo:
      seq_name: "GREAT_campus01_smoke"
      pose_output_en: true

    pcd_save:
      pcd_save_en: false
      type: 0
      colmap_output_en: false
      filter_size_pcd: 0.15
      interval: -1

    image_save:
      img_save_en: false
      interval: 1

    gps:
      # P0 baseline: raw GNSS topics stay in the bag but do not enter FAST-LIVO2.
      gps_en: false
      debug_mode: false
      gps_time_offset: 0.0
      extrinsic_T: [-0.050, -0.650, 0.150]
      gps_topic: "/gnss/observations"

    opt:
      load_data: false
      rtk_cov: 0.01
      livo2_RPY_cov: 0.00000001
      livo2_XYZ_cov: 0.001
